name: Build patch
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon assembleDebug
