name: Build patch
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test physical rear-display profiles
        run: |
          javac --release 8 -d build/profile-tests src/local/leica/watermarkfix/RearDevice.java tests/local/leica/watermarkfix/RearDeviceTest.java
          java -cp build/profile-tests local.leica.watermarkfix.RearDeviceTest
      - run: gradle --no-daemon assembleDebug
